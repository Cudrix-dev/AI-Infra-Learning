<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7d"/>
    </marker>
    <marker id="arrow-comm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b46c1"/>
    </marker>
    <style>
      .title { font-size: 24px; font-weight: 700; fill: #1f2d3d; }
      .label { font-size: 16px; fill: #1f2d3d; }
      .muted { font-size: 14px; fill: #5b6b7d; }
      .small { font-size: 13px; fill: #5b6b7d; }
      .head  { font-size: 17px; font-weight: 700; fill: #ffffff; }
      .step  { font-size: 17px; font-weight: 600; fill: #1f2d3d; }
      .code  { font-family: Consolas, Menlo, 'DejaVu Sans Mono', monospace; }
      .cell  { font-size: 13px; font-weight: 600; fill: #ffffff; }
      .flow  { stroke: #5b6b7d; stroke-width: 2; fill: none; }
      .comm  { stroke: #6b46c1; stroke-width: 2.5; fill: none; }
    </style>
  </defs>

  <!-- background (explicit, so the image stays readable on dark Markdown themes) -->
  <rect width="1200" height="980" rx="16" fill="#ffffff"/>

  <text x="600" y="48" text-anchor="middle" class="title">One training step, two ranks (one process per GPU)</text>

  <!-- once, before the loop -->
  <rect x="60" y="74" width="1080" height="50" rx="10" fill="#f6f8fb" stroke="#9aa8b8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="84" y="105" class="label"><tspan font-weight="700">Once, before step 0:</tspan> <tspan class="code">dist.broadcast(p, src=0)</tspan> for every parameter, so both ranks start from rank 0's weights</text>

  <!-- global batch -->
  <text x="600" y="164" text-anchor="middle" class="label"><tspan font-weight="700">Global batch:</tspan> 16 rows, built identically on every rank from <tspan class="code">(seed, step)</tspan></text>
  <g>
    <rect x="120" y="178" width="480" height="34" rx="6" fill="#2f6fdb"/>
    <rect x="600" y="178" width="480" height="34" rx="6" fill="#e07b28"/>
    <g stroke="#ffffff" stroke-width="2">
      <line x1="180" y1="178" x2="180" y2="212"/><line x1="240" y1="178" x2="240" y2="212"/>
      <line x1="300" y1="178" x2="300" y2="212"/><line x1="360" y1="178" x2="360" y2="212"/>
      <line x1="420" y1="178" x2="420" y2="212"/><line x1="480" y1="178" x2="480" y2="212"/>
      <line x1="540" y1="178" x2="540" y2="212"/><line x1="600" y1="178" x2="600" y2="212"/>
      <line x1="660" y1="178" x2="660" y2="212"/><line x1="720" y1="178" x2="720" y2="212"/>
      <line x1="780" y1="178" x2="780" y2="212"/><line x1="840" y1="178" x2="840" y2="212"/>
      <line x1="900" y1="178" x2="900" y2="212"/><line x1="960" y1="178" x2="960" y2="212"/>
      <line x1="1020" y1="178" x2="1020" y2="212"/>
    </g>
    <g text-anchor="middle" class="cell">
      <text x="150" y="200" class="cell">0</text><text x="210" y="200" class="cell">1</text>
      <text x="270" y="200" class="cell">2</text><text x="330" y="200" class="cell">3</text>
      <text x="390" y="200" class="cell">4</text><text x="450" y="200" class="cell">5</text>
      <text x="510" y="200" class="cell">6</text><text x="570" y="200" class="cell">7</text>
      <text x="630" y="200" class="cell">8</text><text x="690" y="200" class="cell">9</text>
      <text x="750" y="200" class="cell">10</text><text x="810" y="200" class="cell">11</text>
      <text x="870" y="200" class="cell">12</text><text x="930" y="200" class="cell">13</text>
      <text x="990" y="200" class="cell">14</text><text x="1050" y="200" class="cell">15</text>
    </g>
  </g>
  <text x="360" y="234" text-anchor="middle" class="muted">rank 0 takes rows 0–7</text>
  <text x="840" y="234" text-anchor="middle" class="muted">rank 1 takes rows 8–15</text>
  <line x1="360" y1="242" x2="360" y2="270" class="flow" marker-end="url(#arrow)"/>
  <line x1="840" y1="242" x2="840" y2="270" class="flow" marker-end="url(#arrow)"/>

  <!-- GPU 0 / rank 0 -->
  <rect x="150" y="274" width="420" height="612" rx="14" fill="#f3f7fe" stroke="#2f6fdb" stroke-width="2"/>
  <path d="M150,288 a14,14 0 0 1 14,-14 h392 a14,14 0 0 1 14,14 v24 h-420 z" fill="#2f6fdb"/>
  <text x="360" y="300" text-anchor="middle" class="head">GPU 0 · rank 0 process</text>

  <!-- GPU 1 / rank 1 -->
  <rect x="630" y="274" width="420" height="612" rx="14" fill="#fef6ee" stroke="#e07b28" stroke-width="2"/>
  <path d="M630,288 a14,14 0 0 1 14,-14 h392 a14,14 0 0 1 14,14 v24 h-420 z" fill="#e07b28"/>
  <text x="840" y="300" text-anchor="middle" class="head">GPU 1 · rank 1 process</text>

  <!-- forward -->
  <rect x="180" y="334" width="360" height="66" rx="10" fill="#ffffff" stroke="#b9cdf3" stroke-width="1.5"/>
  <text x="360" y="361" text-anchor="middle" class="step">forward on rows 0–7</text>
  <text x="360" y="384" text-anchor="middle" class="muted">local loss L₀ = mean over its 8 rows</text>
  <rect x="660" y="334" width="360" height="66" rx="10" fill="#ffffff" stroke="#f3cba6" stroke-width="1.5"/>
  <text x="840" y="361" text-anchor="middle" class="step">forward on rows 8–15</text>
  <text x="840" y="384" text-anchor="middle" class="muted">local loss L₁ = mean over its 8 rows</text>
  <line x1="360" y1="400" x2="360" y2="426" class="flow" marker-end="url(#arrow)"/>
  <line x1="840" y1="400" x2="840" y2="426" class="flow" marker-end="url(#arrow)"/>

  <!-- backward -->
  <rect x="180" y="430" width="360" height="66" rx="10" fill="#ffffff" stroke="#b9cdf3" stroke-width="1.5"/>
  <text x="360" y="457" text-anchor="middle" class="step">backward</text>
  <text x="360" y="480" text-anchor="middle" class="muted">g₀ = ∇L₀  (gradient of the local mean)</text>
  <rect x="660" y="430" width="360" height="66" rx="10" fill="#ffffff" stroke="#f3cba6" stroke-width="1.5"/>
  <text x="840" y="457" text-anchor="middle" class="step">backward</text>
  <text x="840" y="480" text-anchor="middle" class="muted">g₁ = ∇L₁  (gradient of the local mean)</text>
  <line x1="360" y1="496" x2="360" y2="534" class="comm" marker-end="url(#arrow-comm)"/>
  <line x1="840" y1="496" x2="840" y2="534" class="comm" marker-end="url(#arrow-comm)"/>
  <text x="372" y="522" class="small">p.grad</text>
  <text x="852" y="522" class="small">p.grad</text>

  <!-- all_reduce band: the per-step gradient synchronization -->
  <rect x="120" y="538" width="960" height="112" rx="14" fill="#f1ebfd" stroke="#6b46c1" stroke-width="2"/>
  <text x="600" y="566" text-anchor="middle" class="step" fill="#4c2f99"><tspan class="code" fill="#4c2f99">all_reduce(g, op=SUM)</tspan></text>
  <text x="600" y="588" text-anchor="middle" class="small">gradient synchronization, in place</text>
  <line x1="452" y1="616" x2="748" y2="616" class="comm" marker-start="url(#arrow-comm)" marker-end="url(#arrow-comm)"/>
  <text x="600" y="608" text-anchor="middle" class="small">NCCL over PCIe (P2P or SHM)</text>
  <rect x="290" y="594" width="140" height="40" rx="8" fill="#ffffff" stroke="#6b46c1" stroke-width="1.5"/>
  <text x="360" y="620" text-anchor="middle" class="step">g₀ + g₁</text>
  <rect x="770" y="594" width="140" height="40" rx="8" fill="#ffffff" stroke="#6b46c1" stroke-width="1.5"/>
  <text x="840" y="620" text-anchor="middle" class="step">g₀ + g₁</text>
  <line x1="360" y1="650" x2="360" y2="676" class="flow" marker-end="url(#arrow)"/>
  <line x1="840" y1="650" x2="840" y2="676" class="flow" marker-end="url(#arrow)"/>

  <!-- divide by world size -->
  <rect x="180" y="680" width="360" height="56" rx="10" fill="#ffffff" stroke="#b9cdf3" stroke-width="1.5"/>
  <text x="360" y="714" text-anchor="middle" class="step">÷ 2  →  ḡ = (g₀ + g₁) / 2</text>
  <rect x="660" y="680" width="360" height="56" rx="10" fill="#ffffff" stroke="#f3cba6" stroke-width="1.5"/>
  <text x="840" y="714" text-anchor="middle" class="step">÷ 2  →  ḡ = (g₀ + g₁) / 2</text>
  <line x1="360" y1="736" x2="360" y2="756" class="flow" marker-end="url(#arrow)"/>
  <line x1="840" y1="736" x2="840" y2="756" class="flow" marker-end="url(#arrow)"/>

  <!-- optimizer step -->
  <rect x="180" y="760" width="360" height="56" rx="10" fill="#ffffff" stroke="#b9cdf3" stroke-width="1.5"/>
  <text x="360" y="784" text-anchor="middle" class="step">AdamW step on ḡ</text>
  <text x="360" y="805" text-anchor="middle" class="small">same code, same optimizer state</text>
  <rect x="660" y="760" width="360" height="56" rx="10" fill="#ffffff" stroke="#f3cba6" stroke-width="1.5"/>
  <text x="840" y="784" text-anchor="middle" class="step">AdamW step on ḡ</text>
  <text x="840" y="805" text-anchor="middle" class="small">same code, same optimizer state</text>
  <line x1="360" y1="816" x2="360" y2="832" class="flow" marker-end="url(#arrow)"/>
  <line x1="840" y1="816" x2="840" y2="832" class="flow" marker-end="url(#arrow)"/>

  <!-- new parameters -->
  <rect x="230" y="836" width="260" height="36" rx="18" fill="#2f6fdb"/>
  <text x="360" y="860" text-anchor="middle" class="head">params at step t+1</text>
  <rect x="710" y="836" width="260" height="36" rx="18" fill="#e07b28"/>
  <text x="840" y="860" text-anchor="middle" class="head">params at step t+1</text>

  <!-- "identical on both ranks" markers in the gap between the GPUs -->
  <g>
    <circle cx="600" cy="708" r="17" fill="#ffffff" stroke="#1f9d6b" stroke-width="2"/>
    <text x="600" y="715" text-anchor="middle" font-size="22" font-weight="700" fill="#1f9d6b">=</text>
    <circle cx="600" cy="788" r="17" fill="#ffffff" stroke="#1f9d6b" stroke-width="2"/>
    <text x="600" y="795" text-anchor="middle" font-size="22" font-weight="700" fill="#1f9d6b">=</text>
    <circle cx="600" cy="854" r="17" fill="#ffffff" stroke="#1f9d6b" stroke-width="2"/>
    <text x="600" y="861" text-anchor="middle" font-size="22" font-weight="700" fill="#1f9d6b">=</text>
  </g>

  <!-- legend -->
  <g transform="translate(150, 922)">
    <rect x="0" y="0" width="18" height="18" rx="4" fill="#2f6fdb"/>
    <text x="26" y="14" class="muted">rank 0 / GPU 0</text>
    <rect x="160" y="0" width="18" height="18" rx="4" fill="#e07b28"/>
    <text x="186" y="14" class="muted">rank 1 / GPU 1</text>
    <rect x="320" y="0" width="18" height="18" rx="4" fill="#f1ebfd" stroke="#6b46c1" stroke-width="1.5"/>
    <text x="346" y="14" class="muted">communication between ranks</text>
    <circle cx="600" cy="9" r="10" fill="#ffffff" stroke="#1f9d6b" stroke-width="2"/>
    <text x="600" y="14" text-anchor="middle" font-size="14" font-weight="700" fill="#1f9d6b">=</text>
    <text x="618" y="14" class="muted">identical bits on both ranks (<tspan class="code">torch.equal</tspan>)</text>
  </g>
</svg>
